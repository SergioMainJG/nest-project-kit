name: Release

# Publishes to npm when a tag like v0.2.0 is pushed. The tag must match package.json "version".
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # npm trusted publishing (OIDC) and provenance attestations.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: bun install --frozen-lockfile
      # prepublishOnly runs check, typecheck, tests and the rspack build.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          # Only needed until trusted publishing is configured on npmjs.com.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
